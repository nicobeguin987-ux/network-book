<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><b>Network Book</b><span id="brandsub">Loading…</span></div>
    <div class="nav" id="nav">
      <a href="#home" data-v="home">Overview</a>
      <a href="#activate" data-v="activate">Activate <span class="ct" id="nc-act"></span></a>
      <a href="#people" data-v="people">People <span class="ct" id="nc-people"></span></a>
      <a href="#companies" data-v="companies">Companies <span class="ct" id="nc-co"></span></a>

      <a href="#settings" data-v="settings">Settings</a>
    </div>
    <div class="foot">
      <div class="sync"><span class="dot" id="syncdot"></span><span id="synctxt">Opening…</span></div>

    </div>
  </nav>
